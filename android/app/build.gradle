plugins {
    id 'com.android.application'
}

// Release signing: pass -PkeystoreProps=<path to a .properties file with storeFile, storePassword, keyAlias, keyPassword>.
// Without it the release build is signed with the debug key, which is fine for installing it yourself.
def releaseProps = new Properties()
if (project.hasProperty('keystoreProps')) {
    file(project.property('keystoreProps')).withInputStream { releaseProps.load(it) }
}

android {
    namespace 'io.github.mantaboardgame.baleencode'
    compileSdk 36

    defaultConfig {
        // Must differ from the official DeepSeek app (com.deepseek.chat), otherwise Android treats this as an update of that app and refuses it
        applicationId "io.github.mantaboardgame.baleencode"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.0.1"
        // `-Parm64Only` builds a smaller APK for current phones (the native OCR libraries are shipped for one CPU type only)
        if (project.hasProperty('arm64Only')) {
            ndk { abiFilters 'arm64-v8a' }
        }
    }

    signingConfigs {
        if (releaseProps.containsKey('storeFile')) {
            release {
                storeFile file(releaseProps['storeFile'])
                storePassword releaseProps['storePassword']
                keyAlias releaseProps['keyAlias']
                keyPassword releaseProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseProps.containsKey('storeFile') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // On-device text recognition (OCR) for images and scanned PDFs
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    // Serve assets over https so ES modules (pdf.js) can be loaded
    implementation 'androidx.webkit:webkit:1.12.1'
}

// The page and pdf.js are copied into src/main/assets by `npm install` (scripts/copy-vendor.mjs)
preBuild.doFirst {
    if (!file('src/main/assets/index.html').exists() || !file('src/main/assets/vendor/pdf.min.mjs').exists()) {
        throw new GradleException('Assets are missing. Run `npm install` in the repository root first.')
    }
}
