name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Android]
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: BaleenCode version
      placeholder: "1.0.0 (see the release you downloaded)"
    validations: {required: true}
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Chat, "Agent: read-only", "Agent: read & write", "Agent: full access", "Agent: browser", "Agent: desktop apps", "Agent: phone apps", "/goal run"]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Please do not paste your API key or private file contents.
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
