name: Idea or feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to do that you can't today?
    validations: {required: true}
  - type: textarea
    id: safety
    attributes:
      label: Anything safety-related to consider?
      description: New abilities should come with limits. Think about what could go wrong if the AI is misled.
